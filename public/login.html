<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="image/logo.jpg" type="image/x-jpg">
    <title>Login - Corporate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Responsive Navbar -->
    <nav class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Brand Name -->
                <div class="flex items-center gap-3">
                    <a href="index.html" class="flex items-center gap-2">
                        <!-- লোগো ইমেজ (আপনার লোগো ফাইলটি 'logo.jpg' নামে প্রজেক্ট ফোল্ডারে রাখবেন) -->
                        <img src="image/logo.jpg" alt="Logo"
                            class="w-10 h-10 rounded-xl object-cover border border-slate-600 shadow-md">
                        <span class="text-lg sm:text-xl font-bold tracking-wide text-emerald-400">PROFYNE LABS -
                            CORPORATE PORTAL</span>
                    </a>
                </div>

                <!-- Desktop Nav Buttons -->
                <div class="hidden md:flex items-center space-x-4">
                    <a href="login.html"
                        class="px-4 py-2 text-sm font-medium text-emerald-400 bg-slate-900/50 border border-emerald-500/30 rounded-xl transition hover:bg-slate-900">Sign
                        In</a>
                    <a href="register.html"
                        class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl shadow-lg transition">Sign
                        Up</a>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button onclick="toggleMenu()" class="text-slate-300 hover:text-white focus:outline-none p-2">
                        <i id="menuIcon" class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Dropdown Menu -->
        <div id="mobileMenu" class="hidden md:hidden px-4 pt-2 pb-4 space-y-2 bg-slate-800 border-t border-slate-700">
            <a href="login.html"
                class="block w-full text-center px-4 py-2.5 text-sm font-medium text-emerald-400 bg-slate-900 rounded-xl">Sign
                In</a>
            <a href="register.html"
                class="block w-full text-center px-4 py-2.5 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl shadow-md">Sign
                Up</a>
        </div>
    </nav>

    <!-- Main Content / Login Card -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl border border-slate-700">
            <h2 class="text-xl sm:text-2xl font-bold text-center text-emerald-400 mb-6">Member Login</h2>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <input type="tel" id="loginPhone" placeholder="Phone Number" required
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <input type="password" id="loginPassword" placeholder="Password" required
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-medium shadow-lg transition text-sm">Login
                    to Dashboard</button>
            </form>

            <p class="text-xs text-center text-slate-400 mt-6">Need an account? <a href="register.html"
                    class="text-emerald-400 hover:underline">Register</a></p>
        </div>
    </main>

    <!-- Script Section -->
    <script>
        // Mobile Menu Toggle Function
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            const icon = document.getElementById('menuIcon');
            menu.classList.toggle('hidden');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        }

        // Login Handler Function
        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const result = await res.json();
                if (result.success) {
                    localStorage.setItem('corporateUser', JSON.stringify(result.user));
                    window.location.href = "dashboard.html";
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error("Login error:", error);
                alert("An error occurred during login. Please try again.");
            }
        }
    </script>
</body>

</html>
