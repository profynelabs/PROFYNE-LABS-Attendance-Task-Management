<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PROFYNE LABS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6">
    <div class="max-w-7xl mx-auto space-y-6">

        <!-- Header -->
        <div
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-900 p-5 sm:p-6 rounded-2xl border border-slate-800 shadow-xl gap-4">
            <div>
                <h1 id="userName" class="text-xl sm:text-2xl font-bold text-emerald-400">PROFYNE LABS</h1>
                <p class="text-xs text-slate-400">Corporate Member Attendance & Task Management</p>
            </div>
            <div class="flex flex-wrap gap-2.5 w-full sm:w-auto">
                <button onclick="openTaskModal()"
                    class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium shadow-lg transition">Update
                    Task & Status</button>
                <button onclick="openModal()"
                    class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-500 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium shadow-lg transition">My
                    Profile Card</button>
                <button onclick="logout()"
                    class="flex-1 sm:flex-none bg-red-600 hover:bg-red-500 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium shadow-lg transition">Logout</button>
            </div>
        </div>

        <!-- Main Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Member List -->
            <div class="lg:col-span-2 bg-slate-900 p-5 sm:p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h3 class="text-base sm:text-lg font-semibold mb-4 text-emerald-300">Registered Members Directory</h3>
                <div id="membersGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Member Cards -->
                </div>
            </div>

            <!-- Attendance Feed -->
            <div
                class="bg-slate-900 p-5 sm:p-6 rounded-2xl border border-slate-800 shadow-xl flex flex-col h-[450px] lg:h-[520px]">
                <h3 class="text-base sm:text-lg font-semibold mb-4 text-emerald-300">Live Attendance Feed</h3>
                <div id="logsContainer" class="flex-grow overflow-y-auto space-y-3 text-xs text-slate-300 pr-1">
                    <!-- Dynamic logs -->
                </div>
            </div>

        </div>
    </div>

    <!-- Task & Comment Update Modal -->
    <div id="taskModal"
        class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-blue-500/30 w-full max-w-md p-6 rounded-2xl shadow-2xl relative">
            <h3 class="text-lg font-bold text-blue-400 mb-4">Update Current Task & Comments</h3>

            <form onsubmit="handleTaskUpdate(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">What are you working on?</label>
                    <input type="text" id="taskInput" placeholder="e.g. Designing Landing Page UI" required
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Progress Comment / Note</label>
                    <textarea id="commentInput" rows="3"
                        placeholder="e.g. Completed 70%, fixing header responsiveness..." required
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white"></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit"
                        class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-sm font-medium shadow-lg transition">Save
                        Updates</button>
                    <button type="button" onclick="closeTaskModal()"
                        class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-sm font-medium border border-slate-700 transition">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal"
        class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-emerald-500/30 w-full max-w-sm p-6 rounded-2xl shadow-2xl relative">
            <div class="text-center">
                <img id="modalAvatar" src=""
                    class="w-20 h-20 rounded-full object-cover border-2 border-emerald-500 mx-auto mb-3 shadow-md">
                <h3 id="modalName" class="text-lg sm:text-xl font-bold text-white">Name</h3>
                <p id="modalDesignation" class="text-xs text-emerald-400 uppercase tracking-widest font-semibold mt-1">
                    Designation</p>
            </div>

            <div class="mt-5 space-y-3 border-t border-slate-800 pt-4 text-xs sm:text-sm">
                <div class="flex justify-between"><span class="text-slate-400">Email:</span> <span id="modalEmail"
                        class="text-slate-200 truncate max-w-[180px]">email@corp.com</span></div>
                <div class="flex justify-between"><span class="text-slate-400">Phone:</span> <span id="modalPhone"
                        class="text-slate-200">+880...</span></div>
                <div class="flex justify-between"><span class="text-slate-400">Current Task:</span> <span id="modalTask"
                        class="text-blue-400 font-medium truncate max-w-[160px]">None</span></div>
                <div class="flex justify-between"><span class="text-slate-400">Total Work Time:</span> <span
                        id="modalHours" class="text-emerald-400 font-bold">0h 0m 0s</span></div>
                <div class="flex justify-between"><span class="text-slate-400">Status:</span> <span id="modalStatus"
                        class="text-emerald-400 font-bold">Active</span></div>
            </div>

            <button onclick="closeModal()"
                class="w-full mt-6 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs sm:text-sm font-medium border border-slate-700 transition">Close
                Card</button>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('corporateUser'));
        let myCurrentFormattedTime = "0h 0m 0s";

        if (!currentUser) {
            window.location.href = "login.html";
        } else {
            loadData();
            setInterval(loadData, 1000);
        }

        async function loadData() {
            const userRes = await fetch('/api/users');
            const users = await userRes.json();

            const me = users.find(u => u.phone === currentUser.phone);
            if (me) {
                myCurrentFormattedTime = me.formattedTime;
                currentUser = { ...currentUser, ...me };
                localStorage.setItem('corporateUser', JSON.stringify(currentUser));
            }

            const grid = document.getElementById('membersGrid');
            grid.innerHTML = users.map(u => `
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col justify-between shadow-sm space-y-3">
                    <div class="flex items-start gap-3">
                        <img src="${u.profilePic}" class="w-12 h-12 rounded-full object-cover border border-emerald-500/50 flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start gap-1">
                                <h4 class="font-bold text-white text-sm sm:text-base truncate">${u.fullname}</h4>
                                <span class="text-[9px] px-2 py-0.5 rounded-full whitespace-nowrap ${u.status === 'Active / Present' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400'}">${u.status}</span>
                            </div>
                            <p class="text-xs text-emerald-400 font-medium mt-0.5">${u.designation}</p>
                            <p class="text-xs text-slate-400 mt-2 truncate">✉️ ${u.email}</p>
                            <p class="text-xs text-slate-400">📞 ${u.phone}</p>
                        </div>
                    </div>

                    <!-- Task & Comment Box -->
                    <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 space-y-1.5 text-xs">
                        <div class="flex items-center gap-1.5 text-blue-400 font-semibold truncate">
                            <span>💻 Working On:</span> <span class="text-slate-200 font-normal">${u.currentTask || 'No task updated'}</span>
                        </div>
                        <div class="flex items-start gap-1.5 text-amber-400/90">
                            <span class="font-semibold">📝 Note:</span> <span class="text-slate-300 italic">${u.taskComment || 'No comments'}</span>
                        </div>
                    </div>

                    <div class="pt-2 border-t border-slate-900 flex justify-between items-center text-xs">
                        <span class="text-slate-400">Working Time:</span>
                        <span class="font-bold text-emerald-400 text-sm font-mono">⏱️ ${u.formattedTime}</span>
                    </div>
                </div>
            `).join('') || '<p class="text-slate-500 text-sm">No registered members yet.</p>';

            const logRes = await fetch('/api/logs');
            const logs = await logRes.json();

            const logsContainer = document.getElementById('logsContainer');
            logsContainer.innerHTML = logs.map(l => `
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                    <div><strong>${l.name}</strong> - <span class="text-slate-400">${l.action}</span></div>
                    <span class="text-[10px] text-emerald-500 font-mono">${l.time}</span>
                </div>
            `).join('') || '<p class="text-slate-500">No attendance activity recorded.</p>';
        }

        function openTaskModal() {
            document.getElementById('taskInput').value = currentUser.currentTask !== "No active task" ? currentUser.currentTask : "";
            document.getElementById('commentInput').value = currentUser.taskComment !== "No comments yet" ? currentUser.taskComment : "";
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeTaskModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        async function handleTaskUpdate(e) {
            e.preventDefault();
            const currentTask = document.getElementById('taskInput').value;
            const taskComment = document.getElementById('commentInput').value;

            const res = await fetch('/api/update-task', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentUser.phone, currentTask, taskComment })
            });
            const result = await res.json();
            if (result.success) {
                currentUser.currentTask = result.user.currentTask;
                currentUser.taskComment = result.user.taskComment;
                localStorage.setItem('corporateUser', JSON.stringify(currentUser));
                closeTaskModal();
                loadData();
            } else {
                alert(result.message);
            }
        }

        function openModal() {
            document.getElementById('modalAvatar').src = currentUser.profilePic;
            document.getElementById('modalName').innerText = currentUser.fullname;
            document.getElementById('modalDesignation').innerText = currentUser.designation;
            document.getElementById('modalEmail').innerText = currentUser.email;
            document.getElementById('modalPhone').innerText = currentUser.phone;
            document.getElementById('modalTask').innerText = currentUser.currentTask || 'None';
            document.getElementById('modalHours').innerText = myCurrentFormattedTime;
            document.getElementById('modalStatus').innerText = currentUser.status;

            document.getElementById('profileModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        async function logout() {
            await fetch('/api/logout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentUser.phone })
            });
            localStorage.removeItem('corporateUser');
            window.location.href = "login.html";
        }
    </script>
</body>

</html>
